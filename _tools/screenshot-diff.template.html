<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Diff</title><style>
body{font:14px/1.4 system-ui;margin:0;background:#f4f4f5;color:#18181b}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
header h1{font-size:15px;margin:0} code{font:600 12px ui-monospace,monospace}
.sub{font-size:12px;color:#666} label{font-size:12px;color:#3f3f46;display:flex;align-items:center;gap:6px}
input[type=range]{accent-color:#0e7490;width:140px} output{font-variant-numeric:tabular-nums;width:44px}
.seg{display:flex;border:1px solid #d4d4d8;border-radius:6px;overflow:hidden} .seg button{font:inherit;font-size:12px;border:0;background:#fff;padding:4px 10px;cursor:pointer;color:#3f3f46}
.seg button+button{border-left:1px solid #d4d4d8} .seg button[aria-pressed=true]{background:#0e7490;color:#fff}
main{padding:16px 24px 48px;display:grid;gap:16px}
.page{background:#fff;border:1px solid #e4e4e7;border-radius:8px;padding:12px 14px}
.page h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap} .page h2 a{text-decoration:none}
.badge{font-size:11px;font-weight:600;border-radius:8px;padding:1px 8px;background:#ffe4e6;color:#be123c} .badge.shift{background:#fef3c7;color:#b45309} .badge.dim{background:#f4f4f5;color:#71717a}
.shots{display:flex;gap:16px;align-items:flex-start;overflow-x:auto}
.shot{flex:none;cursor:zoom-in;border:1px solid #d4d4d8;background:#f4f4f5;max-height:520px;overflow:hidden;position:relative}
.shot.m{width:150px} .shot.d{width:520px} .shot img{width:100%;display:block}
.shot figcaption{position:absolute;left:0;top:0;background:rgba(255,255,255,.92);font-size:11px;padding:1px 6px;border-bottom-right-radius:6px}
.empty{padding:40px;text-align:center;color:#666}
.note{font-size:12px;color:#666;margin:0 24px 8px}
details{margin:0 24px;font-size:12px;color:#52525b}
/* Compare view */
#cmp{position:fixed;inset:0;z-index:50;background:#18181b;display:none;flex-direction:column}
#cmp.open{display:flex}
#bar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:#27272a;color:#fff;font-size:12px;flex-wrap:wrap}
#bar .seg{border-color:#52525b} #bar .seg button{background:#27272a;color:#e4e4e7} #bar .seg button[aria-pressed=true]{background:#0e7490}
#bar button.x{margin-left:auto;font:inherit;background:none;border:1px solid #52525b;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
#bar kbd{font:11px ui-monospace,monospace;border:1px solid #52525b;border-radius:4px;padding:0 5px}
#scroll{flex:1;overflow:auto;display:grid;place-items:start center;padding:16px}
#stage{position:relative;line-height:0;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#stage img{display:block;width:100%}
#stage .top{position:absolute;left:0;top:0;width:100%}
#stage.slide .top{clip-path:inset(0 0 0 var(--split,50%))}
#handle{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#0e7490;cursor:ew-resize;display:none;z-index:3}
#handle::after{content:'';position:absolute;top:50vh;left:-9px;width:21px;height:21px;border-radius:50%;background:#0e7490;border:2px solid #fff}
#stage.slide #handle{display:block}
.mark{position:absolute;left:0;right:0;background:rgba(255,40,70,.12);border-top:2px solid rgba(255,40,70,.8);border-bottom:2px solid rgba(255,40,70,.8);pointer-events:none;z-index:2}
</style></head><body>
<header><h1>Screenshot diff</h1><span class="sub"><code id="base"></code> → <code id="head"></code> · <span id="summary"></span></span>
<label>Hide below <input id="min" type="range" min="0" max="20" step="0.5" value="0"><output id="min-val">0%</output></label>
<div class="seg" id="sizes" role="group" aria-label="Show"><button type="button" data-v="both" aria-pressed="true">Both</button><button type="button" data-v="mobile">Mobile</button><button type="button" data-v="desktop">Desktop</button></div></header>
<div id="extras"></div>
<main id="list"></main>
<div id="cmp"><div id="bar"><strong id="cmp-title"></strong>
<div class="seg" id="modes" role="group" aria-label="Compare mode"><button type="button" data-m="slide" aria-pressed="true">Slider</button><button type="button" data-m="flick">Flicker</button><button type="button" data-m="new">After</button><button type="button" data-m="old">Before</button></div>
<span id="flick-state"></span><span><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> page · <kbd>M</kbd> mobile/desktop · <kbd>Esc</kbd> close</span><button class="x" id="close" type="button">Close</button></div>
<div id="scroll"><div id="stage"><img id="img-old" alt=""><img id="img-new" class="top" alt=""><div id="handle"></div></div></div></div>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const name = s => DATA.names[s] ? s + ' (' + DATA.names[s] + ')' : s;
$('base').textContent = name(DATA.base); $('head').textContent = name(DATA.head);
const orig = (sha, size, slug) => DATA.image_root + '/' + sha + '/' + size + '/' + slug + '.png';
const over = (size, slug) => DATA.diff_root + '/' + size + '/' + slug + '.jpg';
const pct = r => r.changed >= 0.1 ? Math.round(r.changed * 100) + '%' : (r.changed * 100).toFixed(1) + '%';
let view = 'both', min = 0;
function render() {
  const sizes = view === 'both' ? ['mobile', 'desktop'] : [view];
  const shown = DATA.pages.filter(p => sizes.some(s => p[s] && p[s].changed > 0 && p[s].changed * 100 >= min));
  const total = DATA.pages.filter(p => ['mobile', 'desktop'].some(s => p[s] && p[s].changed > 0)).length;
  $('summary').textContent = total + ' of ' + DATA.pages.length + ' pages changed' + (shown.length < total ? ' · showing ' + shown.length : '');
  $('list').innerHTML = shown.length ? shown.map(p => {
    const badges = sizes.filter(s => p[s] && p[s].changed > 0).map(s => {
      const r = p[s], shift = r.delta ? ' <span class="badge shift" title="Page height changed">' + (r.delta > 0 ? '+' : '') + r.delta + 'px</span>' : '';
      return '<span class="badge">' + s + ' ' + pct(r) + '</span>' + shift;
    }).join('');
    const figs = sizes.filter(s => p[s] && p[s].changed > 0).map(s =>
      '<figure class="shot ' + s[0] + '" data-slug="' + p.slug + '" data-size="' + s + '" style="margin:0"><figcaption>' + s + '</figcaption><img loading="lazy" src="' + over(s, p.slug) + '" alt=""></figure>').join('');
    return '<article class="page"><h2><a href="' + esc(p.path) + '" target="_blank">' + esc(p.path) + '</a>' + badges + '</h2><div class="shots">' + figs + '</div></article>';
  }).join('') : '<div class="empty">No pages changed' + (min ? ' above ' + min + '%' : '') + '.</div>';
}
$('extras').innerHTML = (DATA.only_new.length ? '<p class="note">New in ' + esc(DATA.head) + ': ' + DATA.only_new.map(esc).join(', ') + '</p>' : '') +
  (DATA.only_old.length ? '<p class="note">Missing from ' + esc(DATA.head) + ': ' + DATA.only_old.map(esc).join(', ') + '</p>' : '');
$('min').oninput = e => { min = +e.target.value; $('min-val').textContent = min + '%'; render(); };
document.querySelectorAll('#sizes button').forEach(b => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('#sizes button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});

// Compare view: before and after at the same width, top aligned, with the changed rows boxed.
let cur = null, mode = 'slide', timer = null;
const flickEls = () => ({ o: $('img-old'), n: $('img-new') });
function open(slug, size) {
  const p = DATA.pages.find(x => x.slug === slug); if (!p || !p[size]) return;
  cur = { slug, size, page: p };
  $('cmp').classList.add('open'); document.body.style.overflow = 'hidden';
  $('cmp-title').textContent = p.path + ' · ' + size;
  const { o, n } = flickEls();
  o.src = orig(DATA.base, size, slug); n.src = orig(DATA.head, size, slug);
  const stage = $('stage'); stage.style.width = (size === 'mobile' ? 390 : 1100) + 'px';
  stage.querySelectorAll('.mark').forEach(m => m.remove());
  n.onload = () => {
    const scale = n.clientWidth / n.naturalWidth;
    p[size].regions.forEach(([a, b]) => {
      const m = document.createElement('div'); m.className = 'mark';
      m.style.top = a * scale + 'px'; m.style.height = Math.max((b - a) * scale, 4) + 'px'; stage.appendChild(m);
    });
  };
  setMode(mode);
}
function setMode(m) {
  mode = m; clearInterval(timer);
  document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  const { n } = flickEls(), st = $('stage');
  st.classList.toggle('slide', m === 'slide'); n.style.visibility = m === 'old' ? 'hidden' : 'visible';
  $('flick-state').textContent = '';
  if (m === 'slide') st.style.setProperty('--split', '50%');
  if (m === 'flick') { let on = true; const tick = () => { n.style.visibility = on ? 'visible' : 'hidden'; $('flick-state').textContent = on ? 'After' : 'Before'; on = !on; }; tick(); timer = setInterval(tick, 700); }
}
function close() { $('cmp').classList.remove('open'); document.body.style.overflow = ''; clearInterval(timer); cur = null; }
function step(d) {
  const sizes = view === 'both' ? ['mobile', 'desktop'] : [view];
  const list = DATA.pages.filter(p => p[cur.size] && p[cur.size].changed > 0 && p[cur.size].changed * 100 >= min);
  const i = list.findIndex(p => p.slug === cur.slug); const nx = list[(i + d + list.length) % list.length]; if (nx) open(nx.slug, cur.size);
}
$('list').onclick = e => { const f = e.target.closest('.shot'); if (f) open(f.dataset.slug, f.dataset.size); };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('close').onclick = close;
const h = $('handle'); let drag = false;
const move = e => { const r = $('stage').getBoundingClientRect(); const x = Math.min(Math.max(e.clientX - r.left, 0), r.width); $('stage').style.setProperty('--split', x + 'px'); h.style.left = x + 'px'; };
h.onpointerdown = e => { drag = true; h.setPointerCapture(e.pointerId); }; h.onpointermove = e => drag && move(e); h.onpointerup = () => drag = false;
$('stage').onclick = e => { if (mode === 'slide' && e.target !== h) move(e); };
addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'Escape') close();
  else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'm' || e.key === 'M') open(cur.slug, cur.size === 'mobile' ? 'desktop' : 'mobile');
  else if (e.key === ' ') { e.preventDefault(); setMode(mode === 'new' ? 'old' : 'new'); }
});
render();
</script></body></html>
