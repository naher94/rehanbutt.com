name: Check for Dead Links

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10 AM UTC
  pull_request:
  push:
    branches:
      - gh-pages
      - development
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lychee link checker
        id: lychee
        continue-on-error: true  # Ensure workflow continues even if Lychee finds dead links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --verbose
            --accept 200,206
            --no-progress
            --require-https
            --max-concurrency 5
            --exclude "./_sass,./_site,./_vendor,./css,./img,./_config.yml,./README.md"
            .
          output: lychee-report.json

      - name: Debugging - List files after Lychee
        run: ls -R

      - name: Check if report exists
        run: |
          if [ -f "./lychee-report.json" ]; then
            echo "✅ Lychee report found."
          else
            echo "⚠️ Warning: Lychee report not found. Creating an empty file."
            touch lychee-report.json  # Prevents failure
          fi

      - name: Debugging - Show report contents
        run: cat lychee-report.json || echo "No report content"

      - name: Upload Lychee Report (if failure)
        if: always()  # Uploads report even if job fails
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.json

      - name: Parse dead links and create issue
        if: steps.lychee.outcome == 'failure' || steps.lychee.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './lychee-report.json';
            
            if (!fs.existsSync(path)) {
              console.log('No report found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));

            if (!report.links || report.links.length === 0) {
              console.log('No dead links found');
              return;
            }

            // Filter only broken links
            const deadLinks = report.links.filter(link => link.status !== 'OK');
            if (deadLinks.length === 0) {
              console.log('No dead links found');
              return;
            }

            let issueBody = "🚨 Lychee found broken links:\n\n";
            deadLinks.forEach(link => {
              issueBody += `- **${link.url}** (in **${link.file}**)\n`;
            });
            issueBody += `\n[Download Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            const issueTitle = "🚨 Dead Links Found!";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dead-link-alert"
            });

            // Create an issue if one doesn't already exist
            if (!issues.some(issue => issue.title === issueTitle)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ["dead-link-alert"]
              });
            }
