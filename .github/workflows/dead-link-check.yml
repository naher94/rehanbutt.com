name: Link Checker

on:
  schedule:
    - cron: '0 3 * * 6' # Runs every day at 10 AM UTC
  push:
    branches:
      - gh-pages
      - development
  workflow_dispatch: # Allows manual trigger

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --accept 200,206
            --no-progress
            --require-https
            --max-concurrency 5
            --exclude "./_sass,./_site,./_vendor,./css,./img,./_config.yml,./README.md"
            --format json
            .
          output: ./lychee-report.json
          
      - name: Parse Lychee report
        id: parse_report
        run: |
          total=$(jq '.statistics.total // 0' ./lychee-report.json)
          ok=$(jq '.statistics.ok // 0' ./lychee-report.json)
          dead_links=$((total - ok))
          if [ "$dead_links" -gt 0 ]; then
            echo "dead_links=true" >> $GITHUB_ENV
          else
            echo "dead_links=false" >> $GITHUB_ENV
          
      - name: Upload Lychee report
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.json
          retention-days: 7

      - name: Create GitHub Issue
        if: env.dead_links == 'true'
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/${{ github.repository }}/issues
          data: |
            {
              "title": "Dead Links Found",
              "body": "This is an issue created by a GitHub Action.",
              "labels": ["bug"]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}