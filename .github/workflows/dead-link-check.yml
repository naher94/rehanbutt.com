name: Check for Dead Links

on:
  schedule:
    - cron: '0 3 * * 6'
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run Lychee link checker
      id: lychee
      uses: lycheeverse/lychee-action@v1
      with:
        args: --verbose --output json

    - name: Create Issue for Broken Links
      if: steps.lychee.outputs.exit-code != 0
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const content = fs.readFileSync('lychee/out.json', 'utf8');
          const results = JSON.parse(content);
          const brokenLinks = results.issues.map(issue => issue.message).join('\n');

          const issueTitle = 'Broken Links Detected';
          const issueBody = `The following links were found to be broken:\n\n${brokenLinks}`;

          const { data: existingIssues } = await github.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'broken-link'
          });

          let issueExists = false;
          for (const issue of existingIssues) {
            if (issue.title === issueTitle) {
              issueExists = true;
              break;
            }
          }

          if (!issueExists) {
            await github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['broken-link']
            });
          }