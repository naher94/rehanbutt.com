name: Check for Dead Links

on:
  schedule:
    # This cron syntax will trigger the workflow every week (every Monday at 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Install link-checking tool
        run: |
          sudo apt-get update
          sudo apt-get install -y linkchecker

      - name: Check for dead links in the gh-pages branch
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          linkchecker --quiet --no-warnings --recursive --check-extern --timeout=10 --nofollow --report-file=dead-links.txt . || true

      - name: Create GitHub issue for dead links
        if: success() && steps.check-links.outputs.dead_links != ''
        run: |
          DEAD_LINKS=$(cat dead-links.txt)
          ISSUE_BODY="Dead links found in the gh-pages branch:\n\n$DEAD_LINKS"

          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -X POST \
            -d "{
              \"title\": \"Dead links found in gh-pages\",
              \"body\": \"$ISSUE_BODY\",
              \"labels\": [\"bug\"]
            }" \
            "https://api.github.com/repos/${{ github.repository }}/issues"
