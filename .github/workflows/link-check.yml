name: Link Checker

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.0

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: _site --exclude '^https://www\.linkedin\.com/in/rehan-butt/' --exclude '^https://codepen\.io/rehanbutt' --exclude '^https://instagram\.com/naher94' --exclude '^https://www\.threads\.net/@naher94' --exclude '^https://threads\.net/intent/' --accept 100..=103,200..=299,403 --user-agent "Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:59.0) Gecko/20100101 Firefox/59.0"
          lycheeVersion: v0.18.0
          fail: false

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Dead Links Found - Link Checker Report
          content-filepath: ./lychee/out.md
          labels: bug, CI/CD