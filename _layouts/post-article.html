---
layout: default
---
<article class="post post-article" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <img class="article-hero" src="/img/posts/{{page.hero}}" alt="{{page.hero-alt}}">
    <div class="scaffold-flex post-header-meta">
      <div>
        <p class="date-stamp">{{ page.date| date: "%B %e, %Y" }}</p>
      </div>
      <div class="social-share">
        <a href="https://threads.net/intent/post?text=Check%20out%20this%20article%20by%20%40naher94!%20{{page.url | prepend: site.url}}" target="_blank" class="share-item threads">
          <i class="fa-brands fa-threads"></i>
        </a>
        <span onclick="copyToClipboard('{{page.url | prepend: site.url}}', this)" class="share-item link">
          <i class="fas fa-link"></i>
        </span>
      </div>
    </div>
    <h1 itemprop="name headline">{{ page.title }}</h1>
    <p class="post-meta">{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>

  <div class="share-bar-wrapper">
    <div class="share-bar scaffold-flex">
      <div class="count-label">{{page.title}}</div>
      <div class="share-buttons scaffold-flex">
        <a href="https://threads.net/intent/post?text=Check%20out%20this%20article%20by%20%40naher94!%20{{page.url | prepend: site.url}}" target="_blank" class="cta-button">
          <i class="fa-brands fa-threads"></i> Share on Threads
          <span class="visually-hidden">Opens a new window</span>
        </a>
        <span onclick="copyToClipboard('{{page.url | prepend: site.url}}', this)" class="cta-button link">
          <i class="fas fa-link"></i> Copy Link
        </span>
      </div>
    </div>
  </div>
</article>
